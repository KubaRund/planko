name: Sestavení Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalace 3D a fyziky
        run: npm install --no-audit --no-fund
      - name: Fyzikální testy
        run: npm test
      - name: Sestavení herního balíčku
        run: npm run build
      - name: Instalace Chromium pro test herního UI
        run: npx playwright install --with-deps chromium
      - name: Test ovládání v mobilním rozlišení
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PLANKO-UI-testy
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -f "$sdk/platforms/android-36/android.jar" ]; then
            "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36'
          fi
      - name: Sestavení debug APK
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: PLANKO-Android-v0.3.0
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PLANKO-unsigned-release-AAB-v0.3.0
          path: app/build/outputs/bundle/release/*.aab
  android-smoke:
    name: Ověření startu na Androidu API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PLANKO-Android-v0.3.0
          path: apk
      - name: Povolit KVM pro emulátor
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalace a spuštění skutečného APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/android-smoke.sh apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PLANKO-Android-startup-test-${{ matrix.api }}
          path: test-results/android/
          if-no-files-found: ignore
